<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alia Bhatt · Qoruz (original)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1f2937; --ink2:#4b5563; --ink3:#6b7280; --line:#e5e7eb; --line2:#f1f2f4; --brand:#f4572a;
  --rail:#212d3b; --bg:#fff; --amber:#a37a12; --green:#138a3d; --red:#991b1b; --purple:#8f63cf;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg);font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.ic{flex:none;display:block}
.shell{display:flex;min-height:100vh}
/* rail */
.rail{width:56px;background:var(--rail);position:fixed;inset:0 auto 0 0;display:flex;flex-direction:column;align-items:center;padding:12px 0;z-index:30}
.rail .logo{margin-bottom:10px}
.rail .rb{width:56px;height:44px;display:grid;place-items:center;color:#cbd5e1;position:relative}
.rail .rb:hover{color:#fff;background:rgba(255,255,255,.06)}
.rail hr{width:28px;border:0;border-top:1px solid #3a4756;margin:8px 0}
.rail .grow{flex:1}
.rail .badge{position:absolute;top:4px;right:12px;background:#f4572a;color:#fff;font-size:9px;font-weight:600;border-radius:9px;padding:1px 4px}
.rail .dot{position:absolute;top:9px;right:15px;width:8px;height:8px;border-radius:50%;background:#22c55e;border:1.5px solid var(--rail)}
.rail .me{width:24px;height:24px;border-radius:50%;object-fit:cover;margin-top:6px}
.rail .coin{background:#a37a12;color:#fff;font-size:10px;font-weight:600;border-radius:10px;padding:1px 6px;margin-top:5px}
.page{margin-left:56px;flex:1;min-width:0}
/* header */
.ph{display:flex;gap:24px;padding:30px 30px 0 24px;position:relative}
.ph .av{width:134px;height:134px;border-radius:50%;padding:3px;background:linear-gradient(135deg,#f4572a,#f9a26c);flex:none;position:relative}
.ph .av img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:3px solid #fff;display:block}
.ph .av .bolt{position:absolute;right:2px;bottom:6px;width:26px;height:26px;border-radius:50%;background:#fff;border:2px solid #f4572a;display:grid;place-items:center;color:#f4572a}
.ph h1{font-size:20px;font-weight:600;display:flex;align-items:center;gap:10px;margin-top:2px}
.ph h1 .s{width:22px;height:22px;border-radius:50%;background:#fdf0fb;color:#e9a3de;font-size:11px;display:grid;place-items:center;font-weight:500}
.tags{display:flex;gap:6px;margin-top:11px;flex-wrap:wrap}
.tag{background:#f3f4f6;border-radius:6px;padding:4px 9px;font-size:14px;color:#374151;display:flex;gap:6px;align-items:center;height:26px}
.bio{margin-top:14px;font-size:14px}
.viewed{margin-top:36px;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:20px;padding:4px 12px 4px 5px;font-size:12px;color:var(--ink3);height:30px;margin-left:-134px;position:relative;left:0}
.viewed .k{width:24px;height:24px;border-radius:50%;background:#3b82f6;color:#fff;display:grid;place-items:center;font-weight:600;font-size:12px}
.viewed b{color:var(--ink);font-weight:600}.viewed a{color:#2563eb;display:flex;align-items:center;gap:3px;background:#eef4ff;border-radius:12px;padding:2px 8px;cursor:pointer;margin-left:2px}
.acts{margin-left:auto;display:flex;gap:8px;align-self:flex-start;position:relative}
.ibtn{width:40px;height:40px;border:1px solid var(--line);border-radius:8px;display:grid;place-items:center;color:#374151;background:#fff}
.ibtn:hover{background:#f9fafb}
.ibtn.saved{background:#e9f6ec;border-color:#bfe3c8;color:#15803d}
.addbtn{height:40px;padding:0 24px;border-radius:8px;background:var(--brand);color:#fff;font-weight:500;display:flex;align-items:center;gap:8px;font-size:14px}
.addbtn:hover{filter:brightness(.95)}
.addbtn.done{background:#15803d}
/* platform tabs */
.plat{display:flex;gap:42px;padding:0 30px 0 24px;margin-top:22px;border-bottom:1px solid var(--line);height:44px;overflow-x:auto;scrollbar-width:none}
.plat button{display:flex;align-items:center;gap:9px;height:44px;font-size:16px;color:#4b5563;border-bottom:2px solid transparent;white-space:nowrap;margin-bottom:-1px}
.plat button.on{color:var(--brand);border-color:var(--brand)}
.plat button:hover{color:var(--brand)}
/* body */
.body{display:flex}
.sub{width:254px;flex:none;border-right:1px solid var(--line2);padding:26px 0 0 24px;position:sticky;top:0;align-self:flex-start;height:100vh}
.sub a{display:flex;align-items:center;gap:10px;height:48px;font-size:16px;color:#4b5563;text-decoration:none;cursor:pointer;padding-left:0}
.sub a.on{color:var(--brand)}
.sub a:hover{color:var(--brand)}
main{flex:1;min-width:0;padding:0 30px 80px 23px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);padding:22px 0 20px}
.kpi{padding:8px 0 8px 24px;border-left:1px solid var(--line2)}
.kpi:first-child{border:0}
.lbl{font-size:14px;color:var(--ink2);text-transform:uppercase;letter-spacing:.01em;display:flex;align-items:center;gap:6px}
.lbl .i{color:#9ca3af;cursor:help}
.val{font-size:22px;font-weight:600;margin-top:16px;display:flex;align-items:center;gap:8px}
.pill{font-size:14px;font-weight:600;color:#fff;border-radius:4px;padding:1px 8px;line-height:20px}
.pill.avg{background:var(--amber)}.pill.top{background:var(--green)}.pill.low{background:var(--red)}
/* AI box */
.ai{border:1px solid #f6bfd0;border-radius:16px;padding:18px 16px 18px;background:linear-gradient(120deg,#fff 40%,#fff7f1)}
.ai .hd{display:flex;align-items:center;gap:8px}
.ai .ttl{font-weight:500;font-size:15px;background:linear-gradient(90deg,#e8267f,#f4572a);-webkit-background-clip:text;background-clip:text;color:transparent;display:flex;align-items:center;gap:8px}
.ai .ttl .ic{color:#e8267f}
.ai .upd{margin-left:auto;font-style:italic;color:#9ca3af;font-size:14px;display:flex;gap:10px;align-items:center}
.ai .upd button{color:#3b82f6}
.aitabs{display:flex;gap:22px;margin-top:14px;border-bottom:1px solid var(--line);font-size:13px}
.aitabs button{padding:6px 0;color:#4b5563;border-bottom:1.5px solid transparent;margin-bottom:-1px}
.aitabs button.on{color:#111827;border-color:#111827}
.aigrid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px 28px;margin-top:20px;padding:0 8px}
.aigrid .k{font-size:12.5px;color:#4b5563;display:flex;align-items:center;gap:6px}
.aigrid .v{font-size:15px;font-weight:500;margin-top:8px;color:#111827;line-height:1.35}
/* insights */
.sec-t{font-size:14px;color:var(--ink2);text-transform:uppercase;letter-spacing:.01em;margin:46px 0 22px;padding-left:24px}
.insights{display:grid;grid-template-columns:1fr 1fr;gap:40px 50px;padding-left:24px}
.in{display:flex;gap:12px}
.in .d{width:17px;height:17px;border-radius:50%;display:grid;place-items:center;color:#fff;margin-top:3px;flex:none}
.in .d.warn{background:#f7b500}.in .d.bad{background:#e03131}.in .d.good{background:#2f9e44}
.in .t{font-size:16px;color:#374151;font-weight:500}.in .s{font-size:14px;color:#6b7280;margin-top:3px}
.mrow{display:flex;gap:24px;padding:26px 0 26px 24px;border-bottom:1px solid var(--line2);align-items:flex-start}
.mrow:first-of-type{margin-top:36px}
.mrow .ty{width:60px;text-align:center;color:#4b5563;font-size:15px;display:flex;flex-direction:column;gap:6px;align-items:center;margin-top:6px}
.mrow .st{display:flex;flex-wrap:wrap;gap:20px 0;max-width:680px}
.mrow .st>div{width:176px}
.mrow .st .v{font-size:20px;margin-top:10px}
.ratio{padding:46px 0 0 24px}
.ratio .val{margin-top:20px}
.ratio .sub2{font-size:14px;color:#6b7280;margin-top:10px}.ratio .sub2 b{color:#111827;font-weight:600}
.hr{border:0;border-top:1px solid var(--line2);margin:46px 0 0}
/* section header */
.sh{background:linear-gradient(#f7f8fb,#fff);border-radius:8px;padding:14px 24px;margin-top:56px;font-size:16px;color:#374151;text-transform:uppercase;display:flex;align-items:center;gap:10px;font-weight:500}
.sh .i{color:#9ca3af;cursor:help}
.sh+.mrow{margin-top:18px}
/* chart */
.legend{display:flex;gap:14px;padding-left:24px;margin-top:18px;flex-wrap:wrap}
.chip{border:1px solid var(--line);border-radius:20px;padding:6px 14px;font-size:14px;display:flex;align-items:center;gap:8px}
.chip b{font-weight:600}
.dots{display:inline-block;width:18px;border-top:2px dotted}
.chartbox{position:relative;margin-top:14px;padding-left:24px}
.tipbox{position:fixed;pointer-events:none;background:#111827;color:#fff;font-size:12px;border-radius:6px;padding:6px 9px;z-index:60;opacity:0;transition:opacity .08s;max-width:240px}
.tipbox.on{opacity:1}
/* tabs & seg */
.seg{display:flex;gap:6px;font-size:14px}
.seg button{padding:6px 12px;border-radius:6px;color:#4b5563}
.seg button.on{background:#f3f4f6;color:var(--brand)}
.seg button:hover{color:var(--brand)}
.rowh{display:flex;justify-content:space-between;align-items:center;padding-left:24px}
.hash{display:flex;flex-wrap:wrap;gap:10px 10px;padding-left:24px;margin-top:20px}
.hash span{background:#f3f4f6;border-radius:4px;padding:5px 8px;font-size:14px;color:#374151}
.posts{display:flex;gap:17px;overflow-x:auto;padding:22px 0 8px 24px;scrollbar-width:none}
.post{width:262px;flex:none}
.post .im{width:262px;height:263px;background:#000;display:grid;place-items:center;position:relative;border-radius:2px;overflow:hidden}
.post .im img{height:100%;max-width:100%;display:block;object-fit:contain}
.post .im .ty{position:absolute;top:12px;right:12px;color:#fff}
.post .m{display:flex;gap:12px;font-size:12.5px;color:#374151;margin-top:8px;align-items:center}
.post .m span{display:flex;gap:4px;align-items:center}
.link{color:#2563eb;cursor:pointer;font-size:14px}
.empty{padding:34px 24px;color:var(--ink3);font-size:14px}
/* audience */
.agrid{display:grid;grid-template-columns:repeat(3,1fr);margin-top:20px}
.agrid>div{padding:26px 0 26px 24px;border-bottom:1px solid var(--line2);border-left:1px solid var(--line2)}
.agrid>div:nth-child(3n+1){border-left:0}
.agrid .big{font-size:22px;font-weight:600;margin-top:20px}
.agrid .small{font-size:14px;color:#6b7280;margin-top:8px}.agrid .small b{color:#111827;font-weight:600}
.beta{background:#6b7280;color:#fff;font-size:11px;border-radius:3px;padding:1px 5px;font-weight:600}
.bars2{display:grid;grid-template-columns:1fr 1fr;gap:20px 50px;padding:26px 24px 0}
.bars2 .col{display:flex;flex-direction:column;gap:20px}
.br .t{display:flex;justify-content:space-between;font-size:14px;color:#374151}
.br .tr{height:7px;background:#eceef2;border-radius:4px;margin-top:9px;overflow:hidden}
.br .tr i{display:block;height:100%;background:#8f63cf;border-radius:4px;transition:width .4s}
.split{display:grid;grid-template-columns:1fr 360px;border-top:1px solid var(--line2);margin-top:30px}
.split>div{padding:30px 24px 24px}
.split>div+div{border-left:1px solid var(--line2)}
.gpills{display:flex;gap:10px;margin-top:20px}
.gp{white-space:nowrap;border:1px solid var(--line);border-radius:20px;padding:5px 14px;font-size:13px;display:flex;gap:8px;align-items:center}
.gp i{width:14px;height:14px;border-radius:50%}
.langwrap{display:flex;align-items:center;gap:30px;padding:10px 24px 0}
.leg{display:grid;grid-template-columns:auto auto auto auto;gap:14px 14px;font-size:14px;align-items:center}
.leg span.n{display:flex;align-items:center;gap:8px;min-width:130px}.leg i{width:8px;height:8px;border-radius:50%}
.leg b{font-weight:500}
/* brands */
.chips{display:flex;gap:8px;overflow-x:auto;padding:22px 0 0 24px;scrollbar-width:none}
.chips button{padding:8px 14px;border-radius:6px;color:#4b5563;white-space:nowrap;font-size:16px}
.chips button.on{background:#f3f4f6;color:var(--brand)}
.chips button:hover{color:var(--brand)}
.brands{display:flex;gap:24px;overflow-x:auto;padding:32px 6px 8px 34px;scrollbar-width:none}
.bc{width:219px;height:280px;border:1px solid var(--line);border-radius:4px;flex:none;text-align:center;padding-top:46px;cursor:pointer}
.bc:hover{box-shadow:0 2px 10px rgba(0,0,0,.08)}
.bc img{width:66px;height:66px;object-fit:cover;display:block;margin:0 auto}
.bc .ph0{width:66px;height:66px;margin:0 auto;background:#f3f4f6;border-radius:4px;display:grid;place-items:center;color:#9ca3af;font-weight:600;font-size:22px}
.bc .n{font-size:20px;font-weight:600;margin-top:30px;white-space:nowrap}
.bc .h{color:#6b7280;margin-top:6px;font-size:16px}
.bc .p{margin-top:32px;text-decoration:underline;color:#6b7280;font-size:16px}
.banner{margin:60px 0 0 24px;border-radius:8px;background:linear-gradient(90deg,#fec3d0 0%,#f9879a 55%,#f65b6e 100%);display:flex;align-items:center;gap:56px;padding:34px 46px;color:#fff}
.banner h3{font-size:24px;font-weight:600}
.banner p{margin-top:6px;font-size:18px;opacity:.9}
.banner .dl{margin-top:40px;background:#fff;color:var(--brand);border-radius:8px;padding:11px 16px;display:inline-flex;gap:8px;align-items:center;font-size:18px;font-weight:500}
.pdfico{width:104px;height:136px;background:linear-gradient(#fda4b4,#f1627a);border-radius:10px;display:grid;place-items:center;flex:none;box-shadow:0 8px 22px rgba(0,0,0,.12)}
/* popovers */
.pop{position:absolute;top:48px;right:0;width:300px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 32px rgba(16,24,40,.14);padding:10px;z-index:40;display:none}
.pop.on{display:block}
.pop h4{font-size:13px;padding:6px 8px;color:var(--ink3);font-weight:500}
.pop label{display:flex;align-items:center;gap:10px;padding:9px 8px;border-radius:6px;cursor:pointer}
.pop label:hover{background:#f9fafb}
.pop input{accent-color:var(--brand);width:16px;height:16px}
.pop .ct{margin-left:auto;color:var(--ink3);font-size:12px}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:#111827;color:#fff;padding:11px 16px;border-radius:8px;opacity:0;pointer-events:none;transition:.2s;z-index:80;font-size:14px}
.toast.on{opacity:1;transform:translate(-50%,0)}
.jump{position:fixed;right:20px;bottom:20px;z-index:70;background:#111827;color:#fff;border-radius:999px;padding:10px 16px 10px 14px;display:flex;gap:8px;align-items:center;text-decoration:none;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.jump:hover{background:#000}
.jump small{opacity:.7;font-weight:400}
.sumcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;padding:30px 0 0 24px}
.sc{border:1px solid var(--line);border-radius:10px;padding:18px;cursor:pointer}
.sc:hover{border-color:var(--brand)}
@media (max-width:1100px){
  .sub{display:none}.aigrid{grid-template-columns:1fr 1fr}.split{grid-template-columns:1fr}.split>div+div{border-left:0;border-top:1px solid var(--line2)}
  .kpis{grid-template-columns:1fr 1fr}.insights,.bars2{grid-template-columns:1fr}.agrid{grid-template-columns:1fr 1fr}
}
@media (max-width:700px){
  .rail{display:none}.page{margin-left:0}.ph{flex-wrap:wrap;padding:20px 16px 0}.acts{margin-left:0;flex-wrap:wrap}.viewed{margin-left:0}
  .plat,.rowh,.hash{padding-left:16px}main{padding:0 16px 80px}.aigrid,.agrid{grid-template-columns:1fr}.banner{flex-direction:column;align-items:flex-start;gap:20px;padding:24px}
  .jump{bottom:12px}.ph .av{width:96px;height:96px}
}
</style>
</head>
<body>
<div class="shell">
  <aside class="rail" id="rail"></aside>
  <div class="page">
    <header class="ph" id="ph"></header>
    <nav class="plat" id="plat" role="tablist" aria-label="Platforms"></nav>
    <div class="body">
      <aside class="sub" id="sub"></aside>
      <main id="main"></main>
    </div>
  </div>
</div>
<div class="tipbox" id="tipbox" role="tooltip"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

  const cp = [[0, 78.4], [.05, 79.0], [.1, 79.9], [.15, 80.7], [.2, 81.9], [.25, 82.9], [.3, 83.5], [.4, 84.4], [.5, 85.0],

  let s = 7; const rnd = () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const out = []; let walk = 0;
  for (let i = 0; i <= n; i++) {
    const f = i / n; let j = 0; while (j < cp.length - 2 && f > cp[j + 1][0]) j++;
    const [f0, v0] = cp[j], [f1, v1] = cp[j + 1];
    const base = v0 + (v1 - v0) * Math.min(1, Math.max(0, (f - f0) / (f1 - f0)));
    walk = walk * .9 + (rnd() - .5) * .04;
    out.push({ t: start + i * DAY, v: (base + walk) * 1e6 });
  }
  out[n].v = 85.3e6;
  for (let i = n - 30; i < n; i++) out[i].v = 85.3e6 - 16.4e3 * (n - i) / 30; // last 30 days: +16.4k
  return out;
}

function wireGrowth() {
  const svg = $('#gsvg'); if (!svg) return;
  const all = D.growthSeries, end = all[all.length - 1].t, day = 864e5, span = { All: Infinity, '1Y': 365, '6M': 182, '3M': 91, '1M': 30 }[S.range];
  const data = span === Infinity ? all : all.filter(p => p.t >= end - span * day);
  const W = 1280, H = 440, L = 12, R = 12, T = 80, B = 50, min = Math.min(...data.map(d => d.v)), max = Math.max(...data.map(d => d.v)), pad = (max - min) * .12 || 1, lo = min - pad * 1.2, hi = max + pad * .4;

  gh.addEventListener('mouseleave', () => { gx.style.display = 'none'; gd.style.display = 'none'; hideTip(); });
}
/* scroll-spy on the left sub-nav */
let spyOn = false;
function spy() {
  if (spyOn) return; spyOn = true;
  const ids = ['overview', 'engagement', 'content', 'audience', 'growth', 'brands', 'pdf'];
  const on = () => {
    if (S.plat !== 'ig') return;
    let cur = ids[0];
    ids.forEach(id => { const el = document.getElementById(id); if (el && el.getBoundingClientRect().top < innerHeight * .35) cur = id; });
    $$('#sub a').forEach(a => a.classList.toggle('on', a.dataset.sub === cur));
  };
  addEventListener('scroll', on, { passive: true });
}
document.addEventListener('click', e => {
  const t = e.target;
  let el;
  if ((el = t.closest('[data-plat]'))) { S.plat = el.dataset.plat; drawTabs(); drawMain(); scrollTo({ top: 0 }); return; }
  if ((el = t.closest('[data-sub]'))) {
    const id = el.dataset.sub;
    if (id === 'ext') return toast('Opens instagram.com/aliaabhatt');
    const tgt = document.getElementById(id); if (tgt) { const y = tgt.getBoundingClientRect().top + scrollY - 8; scrollTo({ top: id === 'overview' ? 260 : y, behavior: 'smooth' }); } return;
  }
  if ((el = t.closest('[data-ai]'))) { S.ai = el.dataset.ai; const y = scrollY; drawMain(); scrollTo(0, y); return; }
  if ((el = t.closest('[data-geo]'))) { S.geo = el.dataset.geo; $('#gseg').innerHTML = $('#gseg').innerHTML; const A = D.audience[S.geo]; $('#geo').innerHTML = halves(A); $$('#gseg button').forEach(b => b.classList.toggle('on', b.dataset.geo === S.geo)); return; }
  if ((el = t.closest('[data-age]'))) { S.age = el.dataset.age; $('#agechart').innerHTML = ageSVG(); $$('#aseg button').forEach(b => b.classList.toggle('on', b.dataset.age === S.age)); wireCharts(); return; }
  if ((el = t.closest('[data-ct]'))) { S.content = el.dataset.ct; $('#posts').innerHTML = postsHTML(); $$('#cseg button').forEach(b => b.classList.toggle('on', b.dataset.ct === S.content)); return; }
  if ((el = t.closest('[data-bc]'))) { S.brandCat = el.dataset.bc; $('#bl').innerHTML = brandCards(D.brands.filter(b => S.brandCat === 'All' || b.cat === S.brandCat)); $$('#bcats button').forEach(b => b.classList.toggle('on', b.dataset.bc === S.brandCat)); return; }
  if ((el = t.closest('[data-r]'))) { S.range = el.dataset.r; $('#gchart').innerHTML = growthSVG(); $$('#rseg button').forEach(b => b.classList.toggle('on', b.dataset.r === S.range)); wireGrowth(); return; }
  if (t.closest('#bm')) { S.saved = !S.saved; const b = $('#bm'); b.classList.toggle('saved', S.saved); b.setAttribute('aria-pressed', S.saved); return toast(S.saved ? 'Creator saved' : 'Removed from saved'); }
  if (t.closest('#add')) { $('#pop').classList.toggle('on'); return; }
  if ((el = t.closest('[data-act]'))) {
    const a = el.dataset.act;
    if (a === 'copy') { try { navigator.clipboard.writeText(location.href); } catch (_) {} return toast('Profile link copied'); }
    if (a === 'pdf') return toast('Preparing PDF… (demo)');
    if (a === 'refresh') return toast('Refreshing AI summary… (demo)');
  }
  if ((el = t.closest('[data-toast]'))) return toast(el.dataset.toast);
  if (!t.closest('#pop')) $('#pop') && $('#pop').classList.remove('on');
});
document.addEventListener('change', e => {
  if (e.target.matches('[data-list]')) {
    const n = $$('#pop input:checked').length; S.added = n > 0; const b = $('#add');
    b.className = 'addbtn' + (S.added ? ' done' : ''); b.innerHTML = S.added ? ic('check', 17) + ' Added' : ic('plus', 17) + ' Add to list';
    toast(e.target.checked ? `Added to “${e.target.dataset.list}”` : `Removed from “${e.target.dataset.list}”`);
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') $('#pop') && $('#pop').classList.remove('on'); });

drawHeader(); drawTabs(); drawSub(); drawMain();
})();
</script>
